[project]
name = "ninanatur"
version = "0.1.0"
description = "Open-data plant trait database for insect-friendly garden planning"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# Explicit, not auto-discovered: setuptools' flat-layout discovery sees every
# top-level directory as a package candidate and refuses to build when it finds
# more than one — here `deploy/` alongside `ninanatur/`.
[tool.setuptools.packages.find]
include = ["ninanatur*"]

[tool.setuptools.package-data]
"ninanatur.web" = ["static/*"]
# The runtime catalogue travels with the code it was built against — plant data
# is derived from static sources, gardens are not.
"ninanatur.data" = ["catalogue.sqlite"]

[project.scripts]
ninanatur-ingest = "ninanatur.ingest.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
