[project]
name = "ninanatur"
version = "0.1.0"
description = "Open-data plant trait database for insect-friendly garden planning"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    # Explicit since Wave 17: the terrain reader imports it directly. It arrived
    # as pandas' transitive dependency before that, which is a working import
    # for the wrong reason — and the reason could stop being true in a release
    # nobody here would be watching.
    "numpy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Wave 20, feature 8: the LoD2 tiles are XML from a service this project
    # does not run. The standard library accepts a DTD and expands what it
    # declares; this refuses both.
    "defusedxml>=0.7",
    # Wave 25 (doc 110): the elevation registry, the readers and the tile
    # fetch are their own package now, published from
    # github.com/JanderHungrige/geokachel. Pinned exactly, because a registry
    # that moved under a running deployment is the failure doc 109 exists to
    # catch — a new state should arrive by somebody choosing it, not by a
    # resolver.
    "geokachel==0.1.0",
    # Wave 25, feature 4 (doc 107): the states publish their laser scans as
    # LAZ, which is LAS packed with an arithmetic coder — not something to
    # reimplement. `laspy` reads the format and `lazrs` unpacks it; both are
    # permissive (BSD-3 and Apache-2.0) and `lazrs` is the Rust backend, which
    # is what makes a hundred-megabyte tile a few seconds rather than a minute.
    "laspy>=2.5",
    "lazrs>=0.6",
    # Wave 26, feature 1 (doc 116): a concave house's shadow is a union of
    # pieces, and a shadow can have a hole — a courtyard's lit ground. The day
    # playback draws that union, and shapely (BSD-3, GEOS inside) computes it
    # rather than a boolean routine written here. Roofs cast plane by plane
    # (feature 5) need the same union.
    "shapely>=2.0",
]

# Explicit, not auto-discovered: setuptools' flat-layout discovery sees every
# top-level directory as a package candidate and refuses to build when it finds
# more than one — here `deploy/` alongside `ninanatur/`.
[tool.setuptools.packages.find]
include = ["ninanatur*"]

[tool.setuptools.package-data]
"ninanatur.web" = ["static/*"]
# The runtime catalogue travels with the code it was built against — plant data
# is derived from static sources, gardens are not. So does the DWD's climate
# (doc 118), which no garden should wait on a request for.
"ninanatur.data" = ["catalogue.sqlite", "climate_de.json.gz"]

[project.scripts]
ninanatur-ingest = "ninanatur.ingest.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12, not the 3.11 floor this once claimed. numpy's own type stubs use PEP 695
# `type` statements, which mypy refuses to parse when told to target 3.11 — so
# the first module here to import numpy turned the whole strict check red. The
# image runs 3.13 and CI runs 3.13; checking against a floor nothing deploys on
# was buying nothing and has now cost something.
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository's root, so `scripts` is importable however pytest is started:
# `python -m pytest` puts it there by itself, a bare `pytest` (as in CI) does not.
pythonpath = ["."]
# No test reaches the network: every socket but a Unix one is refused
# (`tests/test_no_network.py`). The light worker's forkserver and the event
# loop talk over Unix sockets, so those stay.
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "gate: a security gate — CI runs these first, by name (.github/workflows/deploy.yml)",
]
