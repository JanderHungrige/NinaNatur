# Dependabot — Wave 20, feature 7. Everything pinned is watched: a pin that
# nothing updates rots into a known vulnerability. Every proposal targets the
# preview branch, so an update is looked at on ninanatur-dev.w3rth.de before it
# can reach production — the same order every other change takes.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev-deployment"
    schedule:
      interval: "weekly"
    groups:
      python:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev-deployment"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev-deployment"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev-deployment"
    schedule:
      interval: "weekly"
