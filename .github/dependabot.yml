# Dependabot — Wave 20, feature 7. Everything pinned is watched: a pin that
# nothing updates rots into a known vulnerability. Every proposal targets the
# preview branch, so an update is looked at on ninanatur-dev.w3rth.de before it
# can reach production — the same order every other change takes.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev-deployment"
    schedule:
      interval: "weekly"
    groups:
      # One pull request for all of them. The lock is compiled, and a pin bumped
      # on its own — pydantic-core without pydantic — is a lock that cannot
      # install; the gate turns that red. Bumped together, they usually fit.
      python:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev-deployment"
    schedule:
      interval: "weekly"
    groups:
      # Packages that only install at matching versions come as one pull
      # request, majors included: proposed one by one, each broke `npm ci`
      # and could never go green (react-dom 19 without react, vite 8 without
      # its plugin; 2026-09-22). A package goes to the first group that
      # matches, so these stand before the catch-all.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      frontend:
        update-types: ["minor", "patch"]
    ignore:
      # openapi-typescript, which writes src/api/types.ts, requires TypeScript
      # 5 (peer ^5.x, 2026-09-22). TypeScript 7 cannot install beside it.
      # Lift this when openapi-typescript accepts it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev-deployment"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev-deployment"
    schedule:
      interval: "weekly"
    # New digests of the same image, not a new Python or Node: a new interpreter
    # needs a lock made for it, and is a deliberate change rather than a bump.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
