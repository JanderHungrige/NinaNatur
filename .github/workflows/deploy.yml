name: build-and-push

# Build the NinaNatur image and push it to GHCR on every push to a deploy branch.
# The host runs a cron-driven deploy/auto-deploy.sh that polls GHCR and rolls the
# container — this workflow never SSHes into the host.
#
#   main            -> image tagged :main -> prod stack on 172.17.0.1:4000
#   dev-deployment  -> image tagged :dev  -> dev  stack on 172.17.0.1:4001
#
# TLS and domains are handled in front by Nginx Proxy Manager.

on:
  # Manual trigger: a path-filtered workflow does not run on a branch-creation
  # push (there is no predecessor commit to diff paths against), and rebuilding
  # without a code change is worth having anyway.
  workflow_dispatch:
  push:
    branches: [main, dev-deployment]
    # Planning docs and deploy config do not change the image.
    paths-ignore:
      - '.mdd/**'
      - 'deploy/**'
      - '**.md'
  # Dependabot's proposals arrive as pull requests, and without this they would
  # arrive untested. A pull request runs the tests and never pushes an image.
  pull_request:
    branches: [dev-deployment, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: janderhungrige
  IMAGE: ninanatur

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The version is derived from the merge history; a shallow clone counts
          # zero and makes anything asserting on it meaningless.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install
        # The dev lock is the image's lock plus the tools: CI tests exactly the
        # versions the image ships, every file checked against its hash.
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      # Named, and first, so that a red build says which promise broke: every
      # route refuses another garden's ids and a token that names none, the
      # security headers are on every answer, every route that acts on a login
      # checks where the request came from, and no test reaches the network.
      # They run again below with everything else.
      - name: Security gates
        run: pytest -q -m gate
      - name: Lint, type-check, test
        run: |
          ruff check .
          mypy ninanatur
          pytest -q

      # What ships, against the advisories published today. A new one turns the
      # build red until the lock moves past it — or, with the reason written
      # beside it, until it is ignored by id (`--ignore-vuln`).
      - name: Audit the Python the image ships
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, typecheck, test
        working-directory: frontend
        run: |
          npm ci
          # The bundle a visitor downloads. The build and test tooling has
          # findings of its own and never reaches a browser (plan item D2).
          npm audit --omit=dev
          npx tsc --noEmit
          npx vitest run

      # A backend change that was not propagated to the generated types must not
      # merge: a stale client compiles fine and fails at runtime instead.
      - name: API types are in sync with the backend
        run: |
          python scripts/generate_openapi.py
          cd frontend && npx openapi-typescript openapi.json -o src/api/types.ts
          git diff --exit-code -- frontend/openapi.json frontend/src/api/types.ts \
            || { echo "::error::Generated API types are stale — run npm run generate:api"; exit 1; }

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge count needs the history, not just the tip.
          fetch-depth: 0

      - name: Select image tag and derive the version
        id: cfg
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi
          # V<major>.<highest completed wave>.<merges on this branch>. Derived so
          # nobody has to remember to bump it — the page is meant to say what is
          # actually deployed.
          WAVE=$(grep -l '^status: complete' .mdd/waves/*.md 2>/dev/null \
                 | sed 's/.*wave-\([0-9]*\)\.md/\1/' | sort -n | tail -1)
          MERGES=$(git rev-list --count --merges HEAD)
          echo "version=V0.${WAVE:-0}.${MERGES}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        # A pull request builds the image and never publishes it.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build with the runner's built-in BuildKit — no docker-container builder to
      # boot, avoiding an extra buildkit pull from Docker Hub.
      # Every event builds: a Dependabot bump of a base image, or of the build
      # itself, is only tested if the image is actually built.
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          TAG: ${{ steps.cfg.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg NINANATUR_VERSION="${{ steps.cfg.outputs.version }}" \
            -t "$IMG:$TAG" -t "$IMG:$SHA" .

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          TAG: ${{ steps.cfg.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GHCR answers "unknown blob" now and then on an otherwise fine push.
          # Without a retry that red build is the whole outcome: the image never
          # reaches the registry, the host's deploy cron keeps rolling the old
          # one, and nothing says so until somebody looks at the version badge.
          push () {
            ref="$1"; n=1
            until docker push "$ref"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::docker push $ref failed after $n attempts"
                return 1
              fi
              echo "push failed (attempt $n) — retrying in $((n * 15))s"
              sleep $((n * 15))
              n=$((n + 1))
            done
          }
          push "$IMG:$TAG"
          push "$IMG:$SHA"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed :${{ steps.cfg.outputs.tag }} (${{ steps.cfg.outputs.version }}) to ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}." >> "$GITHUB_STEP_SUMMARY"
          echo "deploy/auto-deploy.sh on the host will pull and roll it on its next tick." >> "$GITHUB_STEP_SUMMARY"
