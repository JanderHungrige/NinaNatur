name: build-and-push

# Build the NinaNatur image and push it to GHCR on every push to a deploy branch.
# The host runs a cron-driven deploy/auto-deploy.sh that polls GHCR and rolls the
# container — this workflow never SSHes into the host.
#
#   main            -> image tagged :main -> prod stack on 172.17.0.1:4000
#   dev-deployment  -> image tagged :dev  -> dev  stack on 172.17.0.1:4001
#
# TLS and domains are handled in front by Nginx Proxy Manager.

on:
  # Manual trigger: a path-filtered workflow does not run on a branch-creation
  # push (there is no predecessor commit to diff paths against), and rebuilding
  # without a code change is worth having anyway.
  workflow_dispatch:
  push:
    branches: [main, dev-deployment]
    # Planning docs and deploy config do not change the image.
    paths-ignore:
      - '.mdd/**'
      - 'deploy/**'
      - '**.md'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: janderhungrige
  IMAGE: ninanatur

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from the merge history; a shallow clone counts
          # zero and makes anything asserting on it meaningless.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -e . pytest ruff mypy types-requests httpx
      - name: Lint, type-check, test
        run: |
          ruff check .
          mypy ninanatur
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, typecheck, test
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      # A backend change that was not propagated to the generated types must not
      # merge: a stale client compiles fine and fails at runtime instead.
      - name: API types are in sync with the backend
        run: |
          python scripts/generate_openapi.py
          cd frontend && npx openapi-typescript openapi.json -o src/api/types.ts
          git diff --exit-code -- frontend/openapi.json frontend/src/api/types.ts \
            || { echo "::error::Generated API types are stale — run npm run generate:api"; exit 1; }

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge count needs the history, not just the tip.
          fetch-depth: 0

      - name: Select image tag and derive the version
        id: cfg
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi
          # V<major>.<highest completed wave>.<merges on this branch>. Derived so
          # nobody has to remember to bump it — the page is meant to say what is
          # actually deployed.
          WAVE=$(grep -l '^status: complete' .mdd/waves/*.md 2>/dev/null \
                 | sed 's/.*wave-\([0-9]*\)\.md/\1/' | sort -n | tail -1)
          MERGES=$(git rev-list --count --merges HEAD)
          echo "version=V0.${WAVE:-0}.${MERGES}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build with the runner's built-in BuildKit — no docker-container builder to
      # boot, avoiding an extra buildkit pull from Docker Hub.
      - name: Build & push image
        env:
          DOCKER_BUILDKIT: "1"
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          TAG: ${{ steps.cfg.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg NINANATUR_VERSION="${{ steps.cfg.outputs.version }}" \
            -t "$IMG:$TAG" -t "$IMG:$SHA" .
          docker push "$IMG:$TAG"
          docker push "$IMG:$SHA"

      - name: Summary
        run: |
          echo "Pushed :${{ steps.cfg.outputs.tag }} (${{ steps.cfg.outputs.version }}) to ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}." >> "$GITHUB_STEP_SUMMARY"
          echo "deploy/auto-deploy.sh on the host will pull and roll it on its next tick." >> "$GITHUB_STEP_SUMMARY"
