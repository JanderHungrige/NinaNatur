# One NinaNatur environment, deployed from a prebuilt GHCR image and kept current
# by deploy/auto-deploy.sh. Used twice on the host — once per env, each with its
# own --env-file:
#
#   docker compose --env-file deploy/.env.prod -f deploy/compose.app.yml up -d   # :4000
#   docker compose --env-file deploy/.env.dev  -f deploy/compose.app.yml up -d   # :4001
#
# COMPOSE_PROJECT_NAME (set in the env-file) keeps the two stacks isolated.
# The port is published on the Docker bridge gateway, 172.17.0.1, and nowhere
# else: Nginx Proxy Manager runs as a container and reaches the app there, with
# no shared network. A bare "4000:4000" binds 0.0.0.0 — and until 2026-09-10 it
# did, so both stacks answered the whole internet in plaintext beside the proxy.
# Not 127.0.0.1 either: the proxy is not on the host's loopback.
services:
  app:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-janderhungrige}/${IMAGE:-ninanatur}:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "172.17.0.1:${APP_PORT}:4000"
    environment:
      NINANATUR_ENV: ${NINANATUR_ENV:-prod}
      NINANATUR_DB: /data/ninanatur.sqlite
      # Lets the feedback box file an issue. Absent is a supported state: the
      # report is still stored on the volume, and `feedback.issue_url IS NULL`
      # is the list of what has not been filed yet.
      NINANATUR_GITHUB_TOKEN: ${NINANATUR_GITHUB_TOKEN:-}
      NINANATUR_GITHUB_REPO: ${NINANATUR_GITHUB_REPO:-JanderHungrige/NinaNatur}
    volumes:
      # A NAMED volume, not the Dockerfile's anonymous one. `VOLUME /data` alone
      # gives each container its own anonymous volume, so auto-deploy.sh rolling
      # a new image would silently start from an empty database — and with a
      # self-updating deploy nobody notices until the gardens are gone.
      - ninanatur-data:/data
    # Docker's json-file driver keeps everything unless told otherwise, and until
    # 2026-09-11 nothing on this host told it: every log grew for as long as its
    # container lived, holding every address that had asked. 5 × 10 MB is weeks
    # of this app's lines.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Scoped by COMPOSE_PROJECT_NAME, so the prod and dev stacks never share data.
  ninanatur-data:
